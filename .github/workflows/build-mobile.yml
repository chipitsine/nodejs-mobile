name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SCCACHE_GHA_ENABLED: 'true'
  ANDROID_NDK_VERSION: r26d
  ANDROID_TARGET_SDK_VERSION: 24

permissions:
  contents: read

jobs:
  build-ios:
    strategy:
      fail-fast: false
      matrix:
        config:
#          - { os: macos-13, target_arch: arm64, xcode: 15.2 }
#          - { os: macos-14, target_arch: arm64, xcode: 15.4 }
          - { os: macos-15, target_arch: arm64, xcode: 16.0 }
#          - { os: macos-13, target_arch: x64-simulator, xcode: 15.2 }

    runs-on: ${{ matrix.config.os }}
    env:
      TARGET_ARCH: ${{ matrix.config.target_arch }}
      XCODE_VERSION: ${{ matrix.config.xcode }}

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /Library/Frameworks/Mono.framework
          sudo rm -rf /Library/Frameworks/Xamarin.iOS.framework
          sudo rm -rf /Library/Frameworks/Xamarin.Android.framework
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /usr/local/share/powershell
          sudo find /Applications -type d -name "Xcode_*.app" ! -name "Xcode_$XCODE_VERSION.app" -prune -exec rm -rf "{}" \;

      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Xcode Select Version
        uses: mobiledevops/xcode-select-version-action@v1
        with:
          xcode-select-version: ${{ matrix.config.xcode }}

      # Python 3.12 (chosen by configure.py) doesn't have support for distutils
      # https://github.com/nodejs/node-gyp/issues/2869 workaround
      - name: Build
        run: |
          ulimit -n 65536
          ulimit -c unlimited
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./tools/ios_framework_prepare.sh $TARGET_ARCH


      - name: who the is Alice
        if: always()
        run: |
          file /Users/runner/work/nodejs-mobile/nodejs-mobile/out/Release/node_js2c
          otool -L /Users/runner/work/nodejs-mobile/nodejs-mobile/out/Release/node_js2c
          lipo -info /Users/runner/work/nodejs-mobile/nodejs-mobile/out/Release/node_js2c
          /Users/runner/work/nodejs-mobile/nodejs-mobile/out/Release/node_js2c

      - name: Show logs
        if: always()
        run: |
          log show | grep node_js2c

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: /Users/runner/Library/Logs/DiagnosticReports/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js2c
          path: /Users/runner/work/nodejs-mobile/nodejs-mobile/out/Release/node_js2c

      - uses: actions/upload-artifact@v4
        with:
          name: node-ios-${{ env.TARGET_ARCH }}
          path: out_ios_${{ env.TARGET_ARCH }}

  combine-ios:
    strategy:
      matrix:
        config:
          - { os: macos-14, xcode: 15.4 }
    runs-on: ${{ matrix.config.os }}
    needs: build-ios
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Xcode Select Version
        uses: mobiledevops/xcode-select-version-action@v1
        with:
          xcode-select-version: ${{ matrix.config.xcode }}

      - uses: actions/download-artifact@v4
        with:
          pattern: node-ios-*
          merge-multiple: true
          path: out_ios

      # Python 3.12 (chosen by configure.py) doesn't have support for distutils
      # https://github.com/nodejs/node-gyp/issues/2869 workaround
      - name: Generate config.gypi
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./configure

      - name: Combine
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./tools/ios_framework_prepare.sh combine_frameworks
          mkdir -p artifacts/include
          cp -R out_ios/NodeMobile.xcframework artifacts/
          ./tools/copy_libnode_headers.sh ios
          cp -R out_ios/libnode/include/* artifacts/include

      - uses: actions/upload-artifact@v4
        with:
          name: nodejs-mobile-ios
          path: artifacts

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: node-ios-*
